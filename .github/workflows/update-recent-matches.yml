# .github/workflows/update-recent-matches.yml
#
# Fetches each tracked account's 3 most recent matches (any queue/mode) with
# a derived per-match performance rating, and commits
# data/recent-matches.json if it changed. Same split as the other two
# workflows: this repo only ever produces the data file — a separate Claude
# scheduled task reads it back and writes it into the Rift Roster artifact's
# live database.
#
# Only 1 + 3 Riot API calls per account, so this runs hourly, same cadence
# as update-ranked.yml, to keep "recent" actually recent.
#
# RIOT_API_KEY is the same personal/dev key used by the other workflows. It
# expires every 24h; a run that fails with "Riot rejected the key" needs a
# fresh key pasted into Settings -> Secrets and variables -> Actions.

name: Update recent matches

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-recent-matches
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch recent matches
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: node scripts/fetch-recent-matches.mjs

      - name: Commit if data changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recent-matches.json
          git commit -m "chore: refresh recent matches"
          git push
